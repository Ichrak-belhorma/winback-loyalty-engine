name: winback-loyalty-engine

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
  DATABASE_URL: postgres://${POSTGRES_USER:-winback}:${POSTGRES_PASSWORD:-winback}@postgres:5432/${POSTGRES_DB:-winback}
  REDIS_URL: redis://redis:6379/0
  USE_MOCKS: ${USE_MOCKS:-true}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-5}
  STORE_NAME: ${STORE_NAME:-Swift Basket}
  MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN:-}
  MAILTRAP_SENDER_EMAIL: ${MAILTRAP_SENDER_EMAIL:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  QUIET_HOURS_START: ${QUIET_HOURS_START:-21}
  QUIET_HOURS_END: ${QUIET_HOURS_END:-8}
  WEEKLY_MESSAGE_CAP: ${WEEKLY_MESSAGE_CAP:-3}
  DEFAULT_CUSTOMER_TIMEZONE: ${DEFAULT_CUSTOMER_TIMEZONE:-America/New_York}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-winback}
      POSTGRES_USER: ${POSTGRES_USER:-winback}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-winback}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build: ./backend
    command: celery -A config worker --loglevel=info
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.123.0
    # Import the committed workflows on first start only, so later edits made in the
    # n8n editor survive restarts.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        if [ ! -f /home/node/.n8n/.workflows-imported ]; then
        n8n import:workflow --separate --input=/workflows &&
        touch /home/node/.n8n/.workflows-imported; fi && exec n8n start
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: UTC
      WEBHOOK_URL: http://localhost:5678/
      DB_SQLITE_POOL_SIZE: "2"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  n8n-data:
